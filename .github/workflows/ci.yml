name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: test
        run: swift test
      - name: build app
        run: ./scripts/build-app.sh "$RUNNER_TEMP/Slip.app"
      - name: verify bundle
        run: codesign --verify --strict "$RUNNER_TEMP/Slip.app"
      - name: build disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/pip" install -r scripts/dmg-requirements.txt
          SLIP_DMG_PYTHON="$RUNNER_TEMP/dmg-tools/bin/python" ./scripts/build-dmg.sh \
            "$RUNNER_TEMP/Slip.app" "$RUNNER_TEMP/Slip.dmg"
